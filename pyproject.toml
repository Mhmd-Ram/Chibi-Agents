[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chibi-pets"
version = "0.1.0"
description = "Desktop chibi overlay that reacts to Claude Code hook events."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
ai = [
    "anthropic>=0.40",
]

[project.scripts]
chibi-daemon = "daemon.__main__:main"

[tool.setuptools.packages.find]
include = ["daemon*"]
